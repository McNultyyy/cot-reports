name: Update COT data

# The CFTC releases the Commitments of Traders report every Friday at ~3:30pm ET,
# reflecting the prior Tuesday's positions. We run Friday evening and again
# Saturday to catch late releases / holiday shifts. A no-change run commits nothing.
on:
  schedule:
    - cron: '30 21 * * 5'   # Fri 21:30 UTC (~4:30-5:30pm ET)
    - cron: '0 12 * * 6'    # Sat 12:00 UTC (safety net)
  workflow_dispatch: {}      # allow manual runs from the Actions tab

# Let the job commit regenerated JSON back to the repo.
permissions:
  contents: write

concurrency:
  group: update-cot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build COT data
        run: python scripts/build_data.py

      - name: Commit updated data
        run: |
          git config user.name  "cot-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes this run."
          else
            git commit -m "data: COT update $(date -u +%Y-%m-%d)"
            git push
          fi
